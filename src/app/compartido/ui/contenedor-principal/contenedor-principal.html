<div class="flex h-screen overflow-hidden bg-[#eef1f6]">
  <barra-lateral 
    class="h-full block transition-all duration-300"
    [isCollapsed]="!isSidebarOpen"
    [username]="authService.username()"
    (toggleSidebarEvent)="toggleSidebar()">
  </barra-lateral>

  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    <barra-superior 
      [title]="tituloActual" 
      [username]="authService.username()"
      (logoutEvent)="authService.logout()">
    </barra-superior>
    <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 bg-[#f4f7f9] custom-scrollbar">
      <router-outlet></router-outlet>
    </div>
  </div>


</div>
