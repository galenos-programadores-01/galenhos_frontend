@if (modal.abierto()) {
  <div
    class="fixed inset-0 bg-[#07153a]/45 flex items-center justify-center p-6 z-[120] animate-in fade-in duration-200"
  >
    <div
      class="w-full max-w-sm bg-white rounded-2xl shadow-[0_20px_60px_rgba(7,21,58,0.3)] p-6 animate-in fade-in zoom-in-95 duration-150 dark:bg-[#1a2337] dark:shadow-[0_20px_60px_rgba(0,0,0,0.55)]"
    >
      <div class="flex flex-col items-center text-center">
        <div
          class="w-14 h-14 rounded-full flex items-center justify-center mb-4"
          [ngClass]="
            modal.tipo() === 'exito'
              ? 'bg-green-100 dark:bg-green-500/15'
              : modal.tipo() === 'error'
                ? 'bg-red-100 dark:bg-red-500/15'
                : 'bg-amber-100 dark:bg-amber-500/15'
          "
        >
          @if (modal.tipo() === 'confirmar' || modal.tipo() === 'info') {
            <svg
              aria-hidden="true"
              class="w-7 h-7 text-amber-600 dark:text-amber-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          } @else if (modal.tipo() === 'exito') {
            <svg
              aria-hidden="true"
              class="w-7 h-7 text-green-600 dark:text-green-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          } @else {
            <svg
              aria-hidden="true"
              class="w-7 h-7 text-red-600 dark:text-red-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
          }
        </div>

        <h3 class="text-base font-bold text-[#07153a] mb-1.5 dark:text-slate-100">{{ modal.titulo() }}</h3>
        <p class="text-[13px] text-[#54617f] leading-relaxed break-words dark:text-slate-300">{{ modal.mensaje() }}</p>
      </div>

      <div class="flex gap-3 mt-6">
        @if (modal.tipo() === 'confirmar') {
          <button
            type="button"
            (click)="modal.cancelar()"
            class="flex-1 py-2.5 rounded-lg border border-[#e0e6f1] bg-white text-[13px] font-semibold text-[#54617f] cursor-pointer transition-colors hover:bg-slate-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"
          >
            Cancelar
          </button>
          <button
            type="button"
            (click)="modal.aceptar()"
            class="flex-1 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-[13px] font-semibold cursor-pointer transition-colors"
          >
            {{ modal.etiquetaConfirmar() }}
          </button>
        } @else {
          <button
            type="button"
            (click)="modal.aceptar()"
            class="flex-1 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-[13px] font-semibold cursor-pointer transition-colors"
          >
            Aceptar
          </button>
        }
      </div>
    </div>
  </div>
}
