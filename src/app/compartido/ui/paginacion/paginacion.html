<div class="flex items-center justify-between gap-4 text-[13px] flex-wrap py-3">
      <div class="text-slate-500 dark:text-slate-400">
        Página <strong class="text-slate-800 dark:text-slate-100">{{ page }}</strong> de <strong class="text-slate-800 dark:text-slate-100">{{ totalPages }}</strong>
        @if (showTotal) {
          <span class="text-slate-400 dark:text-slate-500"> (Total: {{ totalItems }})</span>
        }
      </div>

      <div class="flex items-center gap-1.5">
        <button
          type="button"
          (click)="irAPagina(1)"
          [disabled]="page <= 1"
          class="w-8 h-8 flex items-center justify-center rounded-md text-slate-500 hover:text-teal-700 hover:bg-teal-50 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent transition-colors cursor-pointer dark:text-slate-400 dark:hover:text-teal-300 dark:hover:bg-teal-500/10 dark:disabled:hover:bg-transparent"
          title="Primera página">
          <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="11 17 6 12 11 7"></polyline><polyline points="18 17 13 12 18 7"></polyline>
          </svg>
        </button>

        <button
          type="button"
          (click)="irAPagina(page - 1)"
          [disabled]="page <= 1"
          class="w-8 h-8 flex items-center justify-center rounded-md text-slate-500 hover:text-teal-700 hover:bg-teal-50 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent transition-colors cursor-pointer dark:text-slate-400 dark:hover:text-teal-300 dark:hover:bg-teal-500/10 dark:disabled:hover:bg-transparent"
          title="Anterior">
          <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        @for (pagina of paginasVisibles(); track pagina) {
          <button
            type="button"
            (click)="irAPagina(pagina)"
            class="min-w-8 h-8 px-1.5 flex items-center justify-center rounded-md font-semibold transition-colors cursor-pointer"
            [ngClass]="
              pagina === page
                ? 'bg-teal-600 text-white'
                : 'text-slate-600 hover:bg-teal-50 hover:text-teal-700 dark:text-slate-300 dark:hover:bg-teal-500/10 dark:hover:text-teal-300'
            ">
            {{ pagina }}
          </button>
        }

        <button
          type="button"
          (click)="irAPagina(page + 1)"
          [disabled]="page >= totalPages"
          class="w-8 h-8 flex items-center justify-center rounded-md text-slate-500 hover:text-teal-700 hover:bg-teal-50 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent transition-colors cursor-pointer dark:text-slate-400 dark:hover:text-teal-300 dark:hover:bg-teal-500/10 dark:disabled:hover:bg-transparent"
          title="Siguiente">
          <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <button
          type="button"
          (click)="irAPagina(totalPages)"
          [disabled]="page >= totalPages"
          class="w-8 h-8 flex items-center justify-center rounded-md text-slate-500 hover:text-teal-700 hover:bg-teal-50 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-transparent transition-colors cursor-pointer dark:text-slate-400 dark:hover:text-teal-300 dark:hover:bg-teal-500/10 dark:disabled:hover:bg-transparent"
          title="Última página">
          <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="13 17 18 12 13 7"></polyline><polyline points="6 17 11 12 6 7"></polyline>
          </svg>
        </button>
      </div>
    </div>
