<div
  class="fixed inset-0 bg-[#07153a]/45 flex items-center justify-center p-6 z-[100] animate-in fade-in duration-200"
>
  <div
    class="w-full max-h-[90vh] overflow-hidden bg-white rounded-[18px] shadow-[0_20px_60px_rgba(7,21,58,0.3)] flex flex-col animate-in fade-in zoom-in-95 duration-150 dark:bg-[#1a2337] dark:shadow-[0_20px_60px_rgba(0,0,0,0.55)]"
    [style.max-width.px]="ancho"
  >
    <div
      class="flex items-start justify-between px-6 py-5 border-b border-[#eef1f6] shrink-0 bg-white rounded-t-[18px] dark:border-slate-700 dark:bg-[#1a2337]"
    >
      <div class="min-w-0">
        <div class="text-base font-bold text-[#07153a] truncate dark:text-slate-100">{{ titulo }}</div>
        @if (subtitulo) {
          <div class="text-[12.5px] text-[#7a86a1] mt-[3px] dark:text-slate-400">{{ subtitulo }}</div>
        }
      </div>
      <button
        type="button"
        (click)="cerrar()"
        class="w-8 h-8 rounded-[9px] border border-[#e0e6f1] bg-white cursor-pointer flex items-center justify-center text-[#54617f] shrink-0 transition-colors hover:bg-gray-50 ml-3 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"
      >
        <svg
          aria-hidden="true"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="p-6 overflow-y-auto min-w-0">
      <ng-content></ng-content>
    </div>
  </div>
</div>
