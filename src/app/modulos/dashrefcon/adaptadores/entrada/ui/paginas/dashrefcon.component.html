<div class="gp-in" style="display: flex; flex-direction: column; gap: 18px;">

  <div style="display: flex; align-items: center; gap: 10px;">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#263c7a" stroke-width="2"><path d="M3 3v18h18" /><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3" /><path d="M21 11v-3h-3" /></svg>
    <div>
      <div style="font-size: 16px; font-weight: 700; color: #07153a;">Dashboard referencias y contrarreferencias</div>
      <div style="font-size: 12.5px; color: #54617f;">Busque los registros por fecha y estado.</div>
    </div>
  </div>

  <div style="background: #fff; border: 1px solid #e6eaf2; border-radius: 16px; padding: 18px 20px;">
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end;">
      <div>
        <label for="dashrefcon-fecha-inicio" style="display: block; font-size: 12px; font-weight: 600; color: #54617f; margin-bottom: 6px;">Fecha inicio</label>
        <input autocomplete="off" id="dashrefcon-fecha-inicio" type="date" [value]="fechaInicio" (change)="fechaInicio = $any($event.target).value"
               style="width: 100%; padding: 9px 14px; border: 1px solid #d5dceb; border-radius: 11px; font-size: 14px; background: #f8fafc; color: #07153a;" />
      </div>
      <div>
        <label for="dashrefcon-fecha-fin" style="display: block; font-size: 12px; font-weight: 600; color: #54617f; margin-bottom: 6px;">Fecha fin</label>
        <input autocomplete="off" id="dashrefcon-fecha-fin" type="date" [value]="fechaFin" (change)="fechaFin = $any($event.target).value"
               style="width: 100%; padding: 9px 14px; border: 1px solid #d5dceb; border-radius: 11px; font-size: 14px; background: #f8fafc; color: #07153a;" />
      </div>
      <div>
        <label for="dashrefcon-estado" style="display: block; font-size: 12px; font-weight: 600; color: #54617f; margin-bottom: 6px;">Estado</label>
        <select autocomplete="off" id="dashrefcon-estado" [value]="idEstado" (change)="onEstadoChange($any($event.target).value)"
                style="width: 100%; padding: 9px 14px; border: 1px solid #d5dceb; border-radius: 11px; font-size: 14px; background: #f8fafc; color: #07153a;">
          <option value="">Todos</option>
          @for (estado of estados; track estado.id) {
            <option [value]="estado.id">{{ estado.id }} - {{ estado.nombre }}</option>
          }
        </select>
      </div>
      <button type="button" (click)="buscar()" [disabled]="buscando"
              style="display: flex; align-items: center; gap: 7px; height: 42px; padding: 0 20px; background: #263c7a; color: #fff; border: none; border-radius: 11px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;"
              [style.opacity]="buscando ? 0.7 : 1">
        @if (buscando) {
          <svg aria-hidden="true" style="animation: gp-spin 1s linear infinite;" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
          <span>Buscando...</span>
        } @else {
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
          <span>Buscar</span>
        }
      </button>
    </div>

    @if (error) {
      <div style="margin-top: 14px; background: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; font-size: 13px; font-weight: 500; padding: 10px 13px; border-radius: 11px;">
        {{ error }}
      </div>
    }

    @if (resultado) {
      <div style="margin-top: 14px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; font-size: 13px; font-weight: 500; padding: 10px 13px; border-radius: 11px;">
        {{ resultado }}
      </div>
    }
  </div>
</div>
