<div class="h-full">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden h-full flex flex-col">
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
      <div>
        <h2 class="font-bold text-[15px] text-[#07153a] uppercase tracking-wide">Antecedentes</h2>
      </div>
      <button type="button" class="bg-[#eaf1ff] text-[#263c7a] px-3 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider flex items-center gap-1 hover:bg-[#d5e2fa] transition-colors">
        <svg aria-hidden="true" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        Editar
      </button>
    </div>
    
    <div class="p-6 flex-1 overflow-y-auto bg-slate-50">
      <form [formGroup]="antecedentesForm" class="flex flex-col gap-5">
        
        <!-- Text Inputs Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="flex flex-col">
            <label for="ant-quirurgicos" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Quirúrgicos</label>
            <input id="ant-quirurgicos" type="text" formControlName="quirurgicos" class="border border-slate-200 rounded-md p-2 text-[13px] focus:ring-1 focus:ring-[#263c7a] focus:outline-none bg-white">
          </div>
          <div class="flex flex-col">
            <label for="ant-patologicos" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Patológicos</label>
            <input id="ant-patologicos" type="text" formControlName="patologicos" class="border border-slate-200 rounded-md p-2 text-[13px] focus:ring-1 focus:ring-[#263c7a] focus:outline-none bg-white">
          </div>
          <div class="flex flex-col">
            <label for="ant-obstetricos" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Obstétricos</label>
            <input id="ant-obstetricos" type="text" formControlName="obstetricos" class="border border-slate-200 rounded-md p-2 text-[13px] focus:ring-1 focus:ring-[#263c7a] focus:outline-none bg-white">
          </div>
          <div class="flex flex-col">
            <label for="ant-alergias" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Alergias</label>
            <input id="ant-alergias" type="text" formControlName="alergias" class="border border-slate-200 rounded-md p-2 text-[13px] focus:ring-1 focus:ring-[#263c7a] focus:outline-none bg-white">
          </div>
          <div class="flex flex-col">
            <label for="ant-familiares" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Familiares</label>
            <input id="ant-familiares" type="text" formControlName="familiares" class="border border-slate-200 rounded-md p-2 text-[13px] focus:ring-1 focus:ring-[#263c7a] focus:outline-none bg-white">
          </div>
          <div class="flex flex-col">
            <label for="ant-otros" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Otros</label>
            <input id="ant-otros" type="text" formControlName="otros" class="border border-slate-200 rounded-md p-2 text-[13px] focus:ring-1 focus:ring-[#263c7a] focus:outline-none bg-white">
          </div>
        </div>

        <hr class="border-slate-200 my-2">

        <!-- Comorbilidades -->
        <div formGroupName="comorbilidades" class="flex flex-col">
          <h3 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-3">Comorbilidad</h3>
          <div class="grid grid-cols-2 lg:grid-cols-3 gap-3">
            <label for="chk-hipertension" class="flex items-center gap-2 cursor-pointer group">
              <input id="chk-hipertension" type="checkbox" formControlName="hipertension" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a]">
              <span class="text-[12.5px] text-slate-700 group-hover:text-[#263c7a] transition-colors">Hipertensión</span>
            </label>
            <label for="chk-anemia" class="flex items-center gap-2 cursor-pointer group">
              <input id="chk-anemia" type="checkbox" formControlName="anemia" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a]">
              <span class="text-[12.5px] text-slate-700 group-hover:text-[#263c7a] transition-colors">Anemia</span>
            </label>
            <label for="chk-tb" class="flex items-center gap-2 cursor-pointer group">
              <input id="chk-tb" type="checkbox" formControlName="tuberculosis" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a]">
              <span class="text-[12.5px] text-slate-700 group-hover:text-[#263c7a] transition-colors">Tuberculosis</span>
            </label>
            <label for="chk-obesidad" class="flex items-center gap-2 cursor-pointer group">
              <input id="chk-obesidad" type="checkbox" formControlName="obesidad" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a]">
              <span class="text-[12.5px] text-slate-700 group-hover:text-[#263c7a] transition-colors">Obesidad</span>
            </label>
            <label for="chk-higado" class="flex items-center gap-2 cursor-pointer group">
              <input id="chk-higado" type="checkbox" formControlName="higadoGraso" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a]">
              <span class="text-[12.5px] text-slate-700 group-hover:text-[#263c7a] transition-colors">Hígado graso</span>
            </label>
            <label for="chk-fuma" class="flex items-center gap-2 cursor-pointer group">
              <input id="chk-fuma" type="checkbox" formControlName="fuma" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a]">
              <span class="text-[12.5px] text-slate-700 group-hover:text-[#263c7a] transition-colors">Fuma actualmente</span>
            </label>
            <label for="chk-dislip" class="flex items-center gap-2 cursor-pointer group">
              <input id="chk-dislipidemia" type="checkbox" formControlName="dislipidemia" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a]">
              <span class="text-[12.5px] text-slate-700 group-hover:text-[#263c7a] transition-colors">Dislipidemia</span>
            </label>
            <label for="chk-tiroidea" class="flex items-center gap-2 cursor-pointer group">
              <input id="chk-tiroidea" type="checkbox" formControlName="enfTiroidea" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a]">
              <span class="text-[12.5px] text-slate-700 group-hover:text-[#263c7a] transition-colors">Enf. tiroidea</span>
            </label>
            <label for="chk-cancer" class="flex items-center gap-2 cursor-pointer group">
              <input id="chk-cancer" type="checkbox" formControlName="cancer" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a]">
              <span class="text-[12.5px] text-slate-700 group-hover:text-[#263c7a] transition-colors">Cáncer</span>
            </label>
          </div>
        </div>

        <div class="flex flex-col mt-2">
          <label for="ant-otras-comor" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Otras Comorbilidades</label>
          <input id="ant-otras-comor" type="text" formControlName="otrasComorbilidades" class="border border-slate-200 rounded-md p-2 text-[13px] focus:ring-1 focus:ring-[#263c7a] focus:outline-none bg-white">
        </div>

      </form>
    </div>
  </div>
</div>
