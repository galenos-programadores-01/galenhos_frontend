<div class="w-full">
  <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden w-full flex flex-col">
    <div class="px-5 sm:px-6 py-4 border-b border-slate-100 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <h2 class="font-bold text-[15px] sm:text-[16px] text-[#07153a] uppercase tracking-wide">Antecedentes</h2>
          @if (cargando()) {
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-medium bg-blue-100 text-blue-700 animate-pulse">
              Cargando antecedentes...
            </span>
          }
          @if (modoEdicion()) {
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-semibold bg-amber-100 text-amber-800">
              Modo Edición
            </span>
          }
        </div>
        <p class="text-[12px] text-[#54617f]">Antecedentes médicos, quirúrgicos y comorbilidades del paciente</p>
      </div>

      <div class="flex items-center gap-2">
        @if (!modoEdicion()) {
          <button 
            type="button" 
            (click)="activarEdicion()"
            [disabled]="cargando()"
            class="bg-[#eaf1ff] text-[#263c7a] px-3.5 py-1.5 rounded-md text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 hover:bg-[#d5e2fa] transition-colors cursor-pointer shadow-2xs disabled:opacity-50">
            <svg aria-hidden="true" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            Editar
          </button>
        } @else {
          <button 
            type="button" 
            (click)="cancelarEdicion()"
            [disabled]="guardando()"
            class="bg-slate-200 text-slate-700 px-3 py-1.5 rounded-md text-[11px] font-bold uppercase tracking-wider hover:bg-slate-300 transition-colors cursor-pointer disabled:opacity-50">
            Cancelar
          </button>
          <button 
            type="button" 
            (click)="guardarCambios()"
            [disabled]="guardando() || antecedentesForm.invalid"
            class="bg-[#263c7a] text-white px-3.5 py-1.5 rounded-md text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 hover:bg-[#1e2f60] transition-colors cursor-pointer shadow-2xs disabled:opacity-50">
            @if (guardando()) {
              <svg aria-hidden="true" class="animate-spin h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Guardando...
            } @else {
              <svg aria-hidden="true" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              Guardar
            }
          </button>
        }
      </div>
    </div>
    
    <div class="p-4 sm:p-6 bg-slate-50/50">
      <form [formGroup]="antecedentesForm" class="flex flex-col gap-6">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div class="flex flex-col">
            <label for="ant-quirurgicos" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Quirúrgicos</label>
            <input id="ant-quirurgicos" type="text" maxlength="250" formControlName="quirurgicos" class="border border-slate-200 rounded-md px-3.5 py-2.5 text-[13px] focus:ring-2 focus:ring-[#263c7a]/30 focus:border-[#263c7a] focus:outline-none bg-white transition-all shadow-2xs disabled:bg-slate-100/70 disabled:text-slate-600 disabled:cursor-not-allowed" placeholder="Sin antecedentes quirúrgicos">
            <app-error-mensaje [control]="antecedentesForm.get('quirurgicos')"></app-error-mensaje>
          </div>
          <div class="flex flex-col">
            <label for="ant-patologicos" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Patológicos</label>
            <input id="ant-patologicos" type="text" maxlength="250" formControlName="patologicos" class="border border-slate-200 rounded-md px-3.5 py-2.5 text-[13px] focus:ring-2 focus:ring-[#263c7a]/30 focus:border-[#263c7a] focus:outline-none bg-white transition-all shadow-2xs disabled:bg-slate-100/70 disabled:text-slate-600 disabled:cursor-not-allowed" placeholder="Sin antecedentes patológicos">
            <app-error-mensaje [control]="antecedentesForm.get('patologicos')"></app-error-mensaje>
          </div>
          <div class="flex flex-col">
            <label for="ant-obstetricos" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Obstétricos</label>
            <input id="ant-obstetricos" type="text" maxlength="250" formControlName="obstetricos" class="border border-slate-200 rounded-md px-3.5 py-2.5 text-[13px] focus:ring-2 focus:ring-[#263c7a]/30 focus:border-[#263c7a] focus:outline-none bg-white transition-all shadow-2xs disabled:bg-slate-100/70 disabled:text-slate-600 disabled:cursor-not-allowed" placeholder="G: P: C: A:">
            <app-error-mensaje [control]="antecedentesForm.get('obstetricos')"></app-error-mensaje>
          </div>
          <div class="flex flex-col">
            <label for="ant-alergias" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Alergias</label>
            <input id="ant-alergias" type="text" maxlength="250" formControlName="alergias" class="border border-slate-200 rounded-md px-3.5 py-2.5 text-[13px] focus:ring-2 focus:ring-[#263c7a]/30 focus:border-[#263c7a] focus:outline-none bg-white transition-all shadow-2xs disabled:bg-slate-100/70 disabled:text-slate-600 disabled:cursor-not-allowed" placeholder="Niega alergias conocidas">
            <app-error-mensaje [control]="antecedentesForm.get('alergias')"></app-error-mensaje>
          </div>
          <div class="flex flex-col">
            <label for="ant-familiares" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Familiares</label>
            <input id="ant-familiares" type="text" maxlength="250" formControlName="familiares" class="border border-slate-200 rounded-md px-3.5 py-2.5 text-[13px] focus:ring-2 focus:ring-[#263c7a]/30 focus:border-[#263c7a] focus:outline-none bg-white transition-all shadow-2xs disabled:bg-slate-100/70 disabled:text-slate-600 disabled:cursor-not-allowed" placeholder="HTA, DM2, otros...">
            <app-error-mensaje [control]="antecedentesForm.get('familiares')"></app-error-mensaje>
          </div>
          <div class="flex flex-col">
            <label for="ant-otros" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Otros</label>
            <input id="ant-otros" type="text" maxlength="250" formControlName="otros" class="border border-slate-200 rounded-md px-3.5 py-2.5 text-[13px] focus:ring-2 focus:ring-[#263c7a]/30 focus:border-[#263c7a] focus:outline-none bg-white transition-all shadow-2xs disabled:bg-slate-100/70 disabled:text-slate-600 disabled:cursor-not-allowed" placeholder="Observaciones adicionales...">
            <app-error-mensaje [control]="antecedentesForm.get('otros')"></app-error-mensaje>
          </div>
        </div>

        <hr class="border-slate-200 my-1">

        <div formGroupName="comorbilidades" class="flex flex-col" [class.opacity-75]="!modoEdicion()">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Comorbilidades</h3>
            @if (!modoEdicion()) {
              <span class="text-[10px] text-slate-400 font-medium italic">Solo lectura</span>
            }
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3" [class.pointer-events-none]="!modoEdicion()">
            <label for="chk-hipertension" class="flex items-center gap-2.5 p-2.5 rounded-md border border-slate-200 bg-white transition-all select-none shadow-2xs" [ngClass]="modoEdicion() ? 'hover:border-blue-300 hover:bg-blue-50/30 cursor-pointer' : 'cursor-not-allowed bg-slate-50/70'">
              <input id="chk-hipertension" type="checkbox" formControlName="hipertension" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a] disabled:cursor-not-allowed">
              <span class="text-[12.5px] font-medium text-slate-700">Hipertensión</span>
            </label>
            <label for="chk-anemia" class="flex items-center gap-2.5 p-2.5 rounded-md border border-slate-200 bg-white transition-all select-none shadow-2xs" [ngClass]="modoEdicion() ? 'hover:border-blue-300 hover:bg-blue-50/30 cursor-pointer' : 'cursor-not-allowed bg-slate-50/70'">
              <input id="chk-anemia" type="checkbox" formControlName="anemia" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a] disabled:cursor-not-allowed">
              <span class="text-[12.5px] font-medium text-slate-700">Anemia</span>
            </label>
            <label for="chk-tb" class="flex items-center gap-2.5 p-2.5 rounded-md border border-slate-200 bg-white transition-all select-none shadow-2xs" [ngClass]="modoEdicion() ? 'hover:border-blue-300 hover:bg-blue-50/30 cursor-pointer' : 'cursor-not-allowed bg-slate-50/70'">
              <input id="chk-tb" type="checkbox" formControlName="tuberculosis" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a] disabled:cursor-not-allowed">
              <span class="text-[12.5px] font-medium text-slate-700">Tuberculosis</span>
            </label>
            <label for="chk-obesidad" class="flex items-center gap-2.5 p-2.5 rounded-md border border-slate-200 bg-white transition-all select-none shadow-2xs" [ngClass]="modoEdicion() ? 'hover:border-blue-300 hover:bg-blue-50/30 cursor-pointer' : 'cursor-not-allowed bg-slate-50/70'">
              <input id="chk-obesidad" type="checkbox" formControlName="obesidad" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a] disabled:cursor-not-allowed">
              <span class="text-[12.5px] font-medium text-slate-700">Obesidad</span>
            </label>
            <label for="chk-higado" class="flex items-center gap-2.5 p-2.5 rounded-md border border-slate-200 bg-white transition-all select-none shadow-2xs" [ngClass]="modoEdicion() ? 'hover:border-blue-300 hover:bg-blue-50/30 cursor-pointer' : 'cursor-not-allowed bg-slate-50/70'">
              <input id="chk-higado" type="checkbox" formControlName="higadoGraso" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a] disabled:cursor-not-allowed">
              <span class="text-[12.5px] font-medium text-slate-700">Hígado graso</span>
            </label>
            <label for="chk-fuma" class="flex items-center gap-2.5 p-2.5 rounded-md border border-slate-200 bg-white transition-all select-none shadow-2xs" [ngClass]="modoEdicion() ? 'hover:border-blue-300 hover:bg-blue-50/30 cursor-pointer' : 'cursor-not-allowed bg-slate-50/70'">
              <input id="chk-fuma" type="checkbox" formControlName="fuma" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a] disabled:cursor-not-allowed">
              <span class="text-[12.5px] font-medium text-slate-700">Fuma actualmente</span>
            </label>
            <label for="chk-dislipidemia" class="flex items-center gap-2.5 p-2.5 rounded-md border border-slate-200 bg-white transition-all select-none shadow-2xs" [ngClass]="modoEdicion() ? 'hover:border-blue-300 hover:bg-blue-50/30 cursor-pointer' : 'cursor-not-allowed bg-slate-50/70'">
              <input id="chk-dislipidemia" type="checkbox" formControlName="dislipidemia" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a] disabled:cursor-not-allowed">
              <span class="text-[12.5px] font-medium text-slate-700">Dislipidemia</span>
            </label>
            <label for="chk-tiroidea" class="flex items-center gap-2.5 p-2.5 rounded-md border border-slate-200 bg-white transition-all select-none shadow-2xs" [ngClass]="modoEdicion() ? 'hover:border-blue-300 hover:bg-blue-50/30 cursor-pointer' : 'cursor-not-allowed bg-slate-50/70'">
              <input id="chk-tiroidea" type="checkbox" formControlName="enfTiroidea" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a] disabled:cursor-not-allowed">
              <span class="text-[12.5px] font-medium text-slate-700">Enf. tiroidea</span>
            </label>
            <label for="chk-cancer" class="flex items-center gap-2.5 p-2.5 rounded-md border border-slate-200 bg-white transition-all select-none shadow-2xs" [ngClass]="modoEdicion() ? 'hover:border-blue-300 hover:bg-blue-50/30 cursor-pointer' : 'cursor-not-allowed bg-slate-50/70'">
              <input id="chk-cancer" type="checkbox" formControlName="cancer" class="w-4 h-4 text-[#263c7a] rounded border-slate-300 focus:ring-[#263c7a] disabled:cursor-not-allowed">
              <span class="text-[12.5px] font-medium text-slate-700">Cáncer</span>
            </label>
          </div>
        </div>

        <div class="flex flex-col">
          <label for="ant-otras-comor" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Otras Comorbilidades</label>
          <input id="ant-otras-comor" type="text" maxlength="250" formControlName="otrasComorbilidades" class="border border-slate-200 rounded-md px-3.5 py-2.5 text-[13px] focus:ring-2 focus:ring-[#263c7a]/30 focus:border-[#263c7a] focus:outline-none bg-white transition-all shadow-2xs disabled:bg-slate-100/70 disabled:text-slate-600 disabled:cursor-not-allowed" placeholder="Especifique otras comorbilidades si aplica...">
          <app-error-mensaje [control]="antecedentesForm.get('otrasComorbilidades')"></app-error-mensaje>
        </div>

      </form>
    </div>
  </div>
</div>
