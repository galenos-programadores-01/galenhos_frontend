<div class="bg-white rounded-lg border border-slate-200 px-4 sm:px-6 py-3.5 sm:py-4 shadow-sm flex flex-wrap items-center justify-between gap-3 sticky top-0 z-20">
  <button
    type="button"
    (click)="volverBandeja.emit()"
    class="group flex items-center gap-2 font-semibold text-[13px] px-3 sm:px-3.5 py-1.5 rounded-md bg-white text-slate-600 border border-slate-200 hover:text-[#0f766e] hover:border-[#0f766e]/30 hover:bg-[#0f766e]/5 hover:shadow-[0_2px_8px_rgba(15,118,110,0.08)] transition-all duration-200 shrink-0 cursor-pointer"
  >
    <svg aria-hidden="true" class="w-4 h-4 text-slate-400 group-hover:text-[#0f766e] group-hover:-translate-x-0.5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    <span>Volver a bandeja</span>
  </button>

  <div class="flex flex-wrap items-center justify-center sm:justify-end md:justify-center gap-x-6 sm:gap-x-8 gap-y-2.5 flex-1">
    <div class="flex items-center gap-2 shrink-0">
      <div class="w-8 h-8 rounded-md bg-slate-100 flex items-center justify-center shrink-0">
        <svg aria-hidden="true" class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
      </div>
      <div class="flex flex-col justify-center">
        <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400 leading-none mb-0.5">Fecha y hora</span>
        <span class="font-bold text-[13px] text-[#07153a] leading-none">{{ fechaEvolucion }} {{ horaEvolucion }}</span>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <div class="w-8 h-8 rounded-md bg-slate-100 flex items-center justify-center shrink-0">
        <svg aria-hidden="true" class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
      </div>
      <div class="flex flex-col justify-center">
        <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400 leading-none mb-0.5">Médico tratante</span>
        <span class="font-bold text-[13px] text-[#07153a] leading-none">{{ medicoTratante || '—' }}</span>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <div class="w-8 h-8 rounded-md bg-slate-100 flex items-center justify-center shrink-0">
        <svg aria-hidden="true" class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
      </div>
      <div class="flex flex-col justify-center">
        <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400 leading-none mb-0.5">Especialidad</span>
        <span class="font-bold text-[13px] text-[#07153a] leading-none">{{ paciente.especialidad || '—' }}</span>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <div class="w-8 h-8 rounded-md bg-slate-100 flex items-center justify-center shrink-0">
        <svg aria-hidden="true" class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v12a2 2 0 002 2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
      </div>
      <div class="flex flex-col justify-center">
        <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400 leading-none mb-0.5">Servicio</span>
        <span class="font-bold text-[13px] text-[#07153a] leading-none truncate max-w-[180px] sm:max-w-[220px]">{{ paciente.servicio || paciente.ubicacion || '—' }}</span>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <div class="w-8 h-8 rounded-md bg-slate-100 flex items-center justify-center shrink-0">
        <svg aria-hidden="true" class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
      </div>
      <div class="flex flex-col justify-center">
        <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400 leading-none mb-0.5">Cama</span>
        <span class="font-bold text-[13px] text-[#07153a] leading-none">{{ paciente.cama || '—' }}</span>
      </div>
    </div>
  </div>
</div>
