@if (errorMessage()) {
  <div class="mb-5 flex items-center gap-2 bg-red-50 text-red-700 text-[12.5px] rounded-lg px-4 py-3">
    <svg aria-hidden="true" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
      <line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>
    </svg>
    {{ errorMessage() }}
  </div>
}
@if (successMessage()) {
  <div class="mb-5 flex items-center gap-2 bg-teal-50 text-teal-700 text-[12.5px] rounded-lg px-4 py-3 transition-all animate-in fade-in">
    <svg aria-hidden="true" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    {{ successMessage() }}
  </div>
}

<div class="mb-8" [formGroup]="ordenesGroup">
  <h3 class="flex items-center gap-2 text-[13px] font-semibold text-teal-950 mb-4 pb-2 border-b border-slate-200">
    <svg aria-hidden="true" class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
      <rect x="8" y="2" width="8" height="4" rx="1"></rect>
      <path d="M9 12h6"></path>
      <path d="M9 16h6"></path>
    </svg>
    Órdenes médicas
  </h3>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap gap-x-5 gap-y-2.5">
      <label class="flex items-center gap-1.5 text-[13.3px] text-slate-700 cursor-pointer hover:text-teal-700 transition-colors">
        <input type="radio" formControlName="orden" value="alta" class="accent-teal-600 w-4 h-4"> Alta médica
      </label>
      <label class="flex items-center gap-1.5 text-[13.3px] text-slate-700 cursor-pointer hover:text-teal-700 transition-colors">
        <input type="radio" formControlName="orden" value="hospitalizacion" class="accent-teal-600 w-4 h-4"> Ingreso hospitalario
      </label>
      <label class="flex items-center gap-1.5 text-[13.3px] text-slate-700 cursor-pointer hover:text-teal-700 transition-colors">
        <input type="radio" formControlName="orden" value="observacion" class="accent-teal-600 w-4 h-4"> Observación
      </label>
      <label class="flex items-center gap-1.5 text-[13.3px] text-slate-700 cursor-pointer hover:text-teal-700 transition-colors">
        <input type="radio" formControlName="orden" value="traslado" class="accent-teal-600 w-4 h-4"> Traslado
      </label>
    </div>
    <div class="flex flex-col">
      <label for="detalleOrden" class="text-[11.5px] font-semibold text-slate-500 mb-1">Detalle de la orden (servicio, cama, especialidad...)</label>
      <textarea id="detalleOrden" rows="2" formControlName="detalle" class="w-full border border-slate-200 rounded-md p-2 text-[13.3px] bg-slate-50 text-slate-800 focus:ring-2 focus:ring-teal-600 focus:border-transparent outline-none resize-y" placeholder="Detalles..."></textarea>
      <app-error-mensaje [control]="ordenesGroup.get('detalle')"></app-error-mensaje>
    </div>

    <div class="flex justify-end mt-1">
      @if (authService.hasPermission('agregar') || authService.hasPermission('modificar')) {
        <button type="button" (click)="guardarOrden()" [disabled]="isSubmitting()" class="flex items-center gap-2 bg-teal-600 hover:bg-teal-700 text-white font-medium py-1.5 px-4 rounded-md shadow-sm transition-colors text-[13px] disabled:opacity-50 disabled:cursor-not-allowed">
          @if (isSubmitting()) {
            <svg aria-hidden="true" class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Guardando...
          } @else {
            Guardar Orden
          }
        </button>
      }
    </div>
  </div>
</div>
